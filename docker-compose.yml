# Switchyard — Traefik dynamic config editor.
#
# Standalone:
#   cp .env.example .env          # set ADMIN_PASSWORD, SESSION_SECRET, …
#   docker compose up -d --build
#   open http://localhost:8080
#
# Behind Traefik:
#   Uncomment COMPOSE_FILE in .env to load the docker-compose.traefik.yml
#   overlay — it registers the container with Traefik and removes the published
#   host port. Then deploy the same way. See .env.example.

services:
  switchyard:
    build: .
    image: switchyard:latest
    container_name: switchyard
    restart: unless-stopped

    # All variables from .env (credentials, OIDC/SSO, health checks, Traefik).
    env_file:
      - .env
    # Container-internal overrides — these take precedence over .env.
    environment:
      NODE_ENV: production
      PORT: "8080"
      TRAEFIK_DYNAMIC_FILE: /data/dynamic.yml

    # Publishes Switchyard on the host (.env PORT, default 8080). The Traefik
    # overlay removes this so the container is reachable only through Traefik.
    ports:
      - "${PORT:-8080}:8080"

    # Mount the DIRECTORY holding the Traefik dynamic config file. Switchyard
    # writes atomically (temp file + rename), so the whole directory must be
    # mounted — not a single file.
    volumes:
      - ${TRAEFIK_DYNAMIC_DIR:-./data}:/data

    # Runs as root by default so it can write root-owned Traefik config files.
    # To drop privileges, uncomment and ensure /data is writable by that uid:gid.
    # user: "1000:1000"
